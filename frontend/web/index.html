<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/preferences.js"></script><title>easyERP · 经营工作台</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/manual.css"><link rel="stylesheet" href="/import.css"><link rel="stylesheet" href="/templates.css"><link rel="stylesheet" href="/preferences.css"><link rel="stylesheet" href="/dark.css"><script src="/locales.js" defer></script><script src="/i18n.js" defer></script><script src="/import.js" defer></script><script src="/app.js" defer></script><script src="/manual.js" defer></script><script src="/templates.js" defer></script></head>
<body><div class="shell">
<aside class="sidebar" id="sidebar"><a class="brand" href="#/overview"><span class="brand-mark">e</span><span>easyERP<small>经营工作台</small></span></a><div class="workspace"><span class="workspace-icon">▦</span><div>本地工作空间<small>把每一步业务，连起来</small></div></div>
<div class="nav-label">工作空间</div><nav id="nav" aria-label="主导航"></nav><div class="sidebar-bottom"><span class="online-dot"></span><div id="connection">正在连接<small>本机数据库 · 查询与录入</small></div><button class="icon-button" id="about" aria-label="查看数据说明">?</button></div></aside>
<div class="main-shell"><header class="topbar"><button class="icon-button mobile-toggle" id="menu" aria-label="打开导航">☰</button><div class="breadcrumb">工作空间 <span>/</span> <strong id="crumb">经营总览</strong></div><div class="top-actions"><div id="appearance-controls" class="appearance-controls"><div class="preference-group" role="group" aria-label="主题"><button type="button" data-theme-value="light" aria-label="白色" title="白色" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-theme-value="dark" aria-label="黑色" title="黑色" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1Z"/></svg></button><button type="button" data-theme-value="system" aria-label="系统同步" title="系统同步" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button></div><div class="preference-group" role="group" aria-label="语言"><button type="button" data-language-value="zh" lang="zh" aria-label="中文" title="中文" aria-pressed="false">ZH</button><button type="button" data-language-value="en" lang="en" aria-label="英文" title="英文" aria-pressed="false">EN</button><button type="button" data-language-value="de" lang="de" aria-label="德文" title="德文" aria-pressed="false">DE</button></div></div><button type="button" id="source-toggle" class="mode-pill" title="点击切换到测试数据">正式数据</button><span class="avatar" title="本地业务用户">本</span></div></header>
<main id="main"><section class="page-heading"><div><div class="eyebrow" id="eyebrow">OVERVIEW</div><h1 id="title">经营总览</h1><p id="subtitle">从订单到回款，看清每一步业务。</p></div><div class="heading-actions"><button class="button" id="refresh">↻ 刷新</button><button class="button" id="export">↓ 导出明细</button><button class="button" id="templates-open">标准主录表下载</button><button class="button" id="import-open">↑ 导入</button><button class="button primary" id="entry-open">＋ 手工录入</button></div></section>
<div class="demo-notice" id="demo-notice" hidden>演示数据 · 来自独立演示库，所有金额与业务均为示例。<button id="back-live">返回正式数据</button></div>
<section class="filters" aria-label="查询筛选"><div class="date-filter"><span id="date-label">查询期间</span><input id="start" type="date" aria-label="开始日期"><span>至</span><input id="end" type="date" aria-label="结束日期"></div><div id="date-presets" class="date-presets" role="group" aria-label="日期快捷选择"><button type="button" class="date-preset" data-date-preset="year" aria-pressed="false">全年</button><button type="button" class="date-preset" data-date-preset="q1" aria-pressed="false">Q1</button><button type="button" class="date-preset" data-date-preset="q2" aria-pressed="false">Q2</button><button type="button" class="date-preset" data-date-preset="q3" aria-pressed="false">Q3</button><button type="button" class="date-preset" data-date-preset="q4" aria-pressed="false">Q4</button></div><select id="currency" aria-label="币种"><option value="CNY">CNY · 人民币</option><option value="USD">USD · 美元</option><option value="EUR">EUR · 欧元</option><option value="ALL">全部币种 · 分别显示</option></select><select id="tz" aria-label="查询时区"><option value="UTC">UTC 时区</option><option value="Europe/Berlin">柏林时区</option><option value="Asia/Shanghai">上海时区</option></select><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索编号、产品或客户" aria-label="搜索"></label><button id="apply" class="button primary small">查询</button></section>
<div class="filter-note" id="filter-note"></div><div id="content" aria-live="polite"><div class="loading">正在读取业务数据…</div></div>
<footer><span>easyERP / 每一项结果，都有来源。</span><span id="query-time"></span></footer></main></div></div>
<div id="drawer-backdrop" class="drawer-backdrop" hidden></div><aside id="drawer" class="drawer" aria-label="业务详情" aria-modal="true" role="dialog" hidden><div id="drawer-content"></div></aside><div id="toast" role="status" hidden></div></body></html>
