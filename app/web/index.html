<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/preferences.js"></script><title>easyERP · 经营工作台</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/manual.css"><link rel="stylesheet" href="/import.css"><link rel="stylesheet" href="/templates.css"><link rel="stylesheet" href="/dark.css"><link rel="stylesheet" href="/preferences.css"><link rel="stylesheet" href="/table-edit.css"><link rel="stylesheet" href="/company.css"><link rel="stylesheet" href="/workspace.css"><script src="/locales.js" defer></script><script src="/i18n.js" defer></script><script src="/import.js" defer></script><script src="/workspace.js" defer></script><script src="/app.js" defer></script><script src="/manual.js" defer></script><script src="/table-edit.js" defer></script><script src="/templates.js" defer></script><script src="/company.js" defer></script></head>
<body><div class="shell"><header class="topbar"><button class="icon-button mobile-toggle" id="menu" aria-label="打开导航">☰</button><div class="topbar-identity"><button type="button" class="brand company-trigger" id="company-trigger" aria-haspopup="dialog" aria-controls="company-popover" aria-expanded="false"><span class="company-brand-copy"><span id="company-brand-name" data-i18n-ignore>设置公司主体</span></span></button><span class="topbar-divider" aria-hidden="true"></span><div class="breadcrumb">工作空间 <span>/</span> <strong id="crumb">仪表盘</strong></div></div><div class="top-actions"><div id="appearance-controls" class="appearance-controls"><div class="preference-group"><button type="button" id="theme-toggle" class="preference-toggle" data-i18n-ignore aria-label="切换主题" title="切换主题"></button></div><div class="preference-group"><button type="button" id="language-toggle" class="preference-toggle" data-i18n-ignore aria-label="切换语言" title="切换语言">ZH</button></div></div><span id="access-level" class="mode-pill" data-i18n-ignore title="访问权限">—</span><time id="rtc-clock" data-i18n-ignore aria-label="当前北京时间">--:--:--</time></div></header>
<aside class="sidebar" id="sidebar">
<nav id="nav" aria-label="主导航"></nav><div class="sidebar-footer"><button type="button" id="templates-open" class="sidebar-download"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span>下载</span></button><div class="sidebar-bottom"><button type="button" id="source-toggle" class="source-control" title="选择数据源" aria-haspopup="menu" aria-controls="source-menu" aria-expanded="false"><span class="online-dot" aria-hidden="true"></span><span id="connection">正在连接</span></button></div></div></aside>
<div class="main-shell">
<main id="main"><section class="page-heading"><h1 id="title">仪表盘</h1><div class="heading-actions"><button class="button" id="refresh">↻ 刷新</button><button class="button" id="export">↓ 导出明细</button><button class="button" id="import-open">↑ 导入</button><button class="button primary" id="entry-open">＋ 新建</button></div></section>
<div class="demo-notice" id="demo-notice" hidden>测试数据 · 独立演示库<button id="back-live">返回正式数据</button></div>
<section class="filters" aria-label="查询筛选"><div class="date-filter"><span class="query-date-label">起始日期</span><span class="query-date" data-date-control="start"><button type="button" id="start-trigger" class="query-date-trigger" aria-label="起始日期">YYYY/MM/DD</button><input id="start" class="query-date-native" type="date" tabindex="-1" aria-hidden="true"></span><span class="query-date-label">截止日期</span><span class="query-date" data-date-control="end"><button type="button" id="end-trigger" class="query-date-trigger" aria-label="截止日期">YYYY/MM/DD</button><input id="end" class="query-date-native" type="date" tabindex="-1" aria-hidden="true"></span></div><div id="date-presets" class="date-presets" role="group" aria-label="日期快捷选择"><button type="button" class="date-preset" data-date-preset="year" aria-pressed="false">全年</button><button type="button" class="date-preset" data-date-preset="q1" aria-pressed="false">Q1</button><button type="button" class="date-preset" data-date-preset="q2" aria-pressed="false">Q2</button><button type="button" class="date-preset" data-date-preset="q3" aria-pressed="false">Q3</button><button type="button" class="date-preset" data-date-preset="q4" aria-pressed="false">Q4</button></div><div class="search-tools"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索编号、产品或客户" aria-label="搜索"></label><button id="apply" class="button primary small">查询</button></div></section>
<div id="content" aria-live="polite"><div class="loading">正在读取业务数据…</div></div>
</main></div></div>
<div id="drawer-backdrop" class="drawer-backdrop" hidden></div><aside id="drawer" class="drawer" aria-label="业务详情" aria-modal="true" role="dialog" hidden><div id="drawer-content"></div></aside><div id="toast" role="status" hidden></div><div id="source-menu" class="source-menu" role="menu" aria-label="选择数据源" hidden>
<button type="button" role="menuitemradio" data-source-value="live" aria-checked="true" tabindex="0"><span>本机数据库</span><svg class="icon source-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg></button>
<button type="button" role="menuitemradio" data-source-value="demo" aria-checked="false" tabindex="-1"><span>演示数据</span><svg class="icon source-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg></button>
</div></body></html>
